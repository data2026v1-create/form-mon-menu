<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire d'envoi d'image</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:disabled {
      background-color: #cccccc;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
    #preview {
      max-width: 100%;
      margin-top: 10px;
      display: none;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Ajouter un élément</h2>
  
  <form id="uploadForm">
    <div class="form-group">
      <label for="nom">Nom / Titre :</label>
      <input type="text" id="nom" name="nom" required>
    </div>

    <div class="form-group">
      <label for="prix">Prix :</label>
      <input type="number" id="prix" name="prix">
    </div>

    <div class="form-group">
      <label for="photo">Photo (Galerie ou Appareil Photo) :</label>
      <!-- accept="image/*" active l'appareil photo ou la galerie sur mobile -->
      <input type="file" id="photo" accept="image/*" capture="environment" required>
      <img id="preview" src="" alt="Aperçu de la photo">
    </div>

    <button type="submit" id="btnSubmit">Envoyer vers Google Sheets</button>
  </form>

  <div id="status"></div>

  <script>
    // Remplacez cette URL par l'URL d'application web de votre Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMlWNIkOfje1vH5cqfeOJAaUSN0gru535NyDPnw9TLXquXmHjOqtOpwZxe-kZF_KsC0A/exec";

    const photoInput = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const form = document.getElementById('uploadForm');
    const statusDiv = document.getElementById('status');
    const btnSubmit = document.getElementById('btnSubmit');

    let base64Image = "";

    // Prévisualisation et conversion de l'image en Base64
    photoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          base64Image = event.target.result;
          preview.src = base64Image;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Envoi des données au script
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      if (!base64Image) {
        alert("Veuillez sélectionner ou prendre une photo.");
        return;
      }

      btnSubmit.disabled = true;
      statusDiv.style.color = "blue";
      statusDiv.innerText = "Envoi en cours...";

      const payload = {
        nom: document.getElementById('nom').value,
        prix: document.getElementById('prix').value,
        image: base64Image
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Nécessaire pour éviter les erreurs CORS avec Google Apps Script
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.style.color = "green";
        statusDiv.innerText = "Succès ! Données et image enregistrées dans Google Sheets.";
        form.reset();
        preview.style.display = 'none';
        base64Image = "";
        btnSubmit.disabled = false;
      })
      .catch(error => {
        console.error('Erreur:', error);
        statusDiv.style.color = "red";
        statusDiv.innerText = "Une erreur s'est produite lors de l'envoi.";
        btnSubmit.disabled = false;
      });
    });
  </script>

</body>
</html>
